<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Loot &amp; Leave</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2efe8;--fg:#1b1b1f;--ac:#e4572e;--card:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#eee;--card:#22242b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#eee;--card:#22242b;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;touch-action:none;overflow:hidden}
#w{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto}
canvas{width:100%;height:100%;display:block;background:#1d2027}
#m{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px;background:rgba(10,10,14,.82);color:#eee}
button{font:inherit;padding:10px;border:0;border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
#go{background:var(--ac);color:#fff;font-weight:700;font-size:18px;padding:14px}
h1{margin:0;font-size:28px}p{margin:2px 0}
</style></head><body><div id="w"><canvas id="c"></canvas><div id="m"></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=640,M=document.getElementById('m');cv.width=W;cv.height=H;
let S={};try{S=JSON.parse(localStorage.getItem('ll')||'{}')}catch(e){}
S.bank=S.bank||0;S.u=S.u||{dmg:0,spd:0,rate:0};S.streak=S.streak||0;S.last=S.last||'';
const save=()=>{try{localStorage.setItem('ll',JSON.stringify(S))}catch(e){}};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rn=Math.random,day=d=>(d||new Date()).toISOString().slice(0,10);
const need=()=>8+(new Date().getDate()%5)*2;
let g,run=false,keys={},ptr=null,anc=null,last=0;
const names={dmg:'Damage',spd:'Speed',rate:'Fire rate'};
function menu(t,msg){
 let h='<h1>'+t+'</h1><p>'+msg+'</p><p><b>Bank: '+S.bank+' ◆</b> · Streak: '+S.streak+'</p><p>Today’s contract: extract with ≥'+need()+' loot for a bonus.</p>';
 for(const k in names){const l=S.u[k],c=8*(l+1);h+='<button onclick="buy(\''+k+'\')">'+names[k]+' Lv'+l+(l>=5?' (max)':' — '+c+' ◆')+'</button>'}
 M.innerHTML=h+'<button id="go" onclick="start()">Drop in</button>';M.style.display='flex'}
function buy(k){const l=S.u[k],c=8*(l+1);if(l<5&&S.bank>=c){S.bank-=c;S.u[k]++;save();menu('Loot &amp; Leave','Upgrade bought.')}}
function start(){g={t:0,p:{x:180,y:320,hp:3,c:0,inv:0,f:0},en:[],bl:[],lt:[],z:null,zt:0,sp:0};run=true;M.style.display='none'}
function end(win){run=false;const p=g.p;let m;
 if(win){let b=p.c;m='Extracted '+p.c+' loot.';
  if(p.c>=need()){if(S.last!==day()){const y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===day(y)?S.streak+1:1;S.last=day()}
   const bo=Math.round(b*.5)+S.streak*2;b+=bo;m+=' Contract met: +'+bo+' bonus!'}
  S.bank+=b;save();menu('Extracted',m)}
 else menu('You died','Lost '+p.c+' carried loot. Greed is expensive.')}
function up(d){const p=g.p;g.t+=d;let dx=0,dy=0;
 if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;
 if(anc&&ptr){const ax=ptr.x-anc.x,ay=ptr.y-anc.y,q=Math.hypot(ax,ay);if(q>8){dx=ax/q;dy=ay/q}}
 const q=Math.hypot(dx,dy);if(q>1){dx/=q;dy/=q}
 const sp=110*(1+.1*S.u.spd)/(1+p.c*.035);p.x=cl(p.x+dx*sp*d,8,W-8);p.y=cl(p.y+dy*sp*d,8,H-8);p.inv-=d;
 g.sp-=d;if(g.sp<=0){g.sp=Math.max(.22,1.1-g.t*.012-p.c*.008);const e=rn()*4|0,big=rn()<.15;
  g.en.push({x:e<2?rn()*W:e==2?-10:W+10,y:e<2?(e?H+10:-10):rn()*H,hp:((2+g.t/40)|0)*(big?2:1),big})}
 for(const e of g.en){const a=Math.atan2(p.y-e.y,p.x-e.x),s=(40+g.t*.5)*(e.big?.7:1);e.x+=Math.cos(a)*s*d;e.y+=Math.sin(a)*s*d;
  if(Math.hypot(p.x-e.x,p.y-e.y)<12&&p.inv<=0){p.hp--;p.inv=1;if(p.hp<=0)return end(false)}}
 p.f-=d;if(p.f<=0){let n=null,nd=170;for(const e of g.en){const k=Math.hypot(e.x-p.x,e.y-p.y);if(k<nd){nd=k;n=e}}
  if(n){const a=Math.atan2(n.y-p.y,n.x-p.x);g.bl.push({x:p.x,y:p.y,vx:Math.cos(a)*320,vy:Math.sin(a)*320,l:.8});p.f=.45/(1+.2*S.u.rate)}}
 for(const b of g.bl){b.x+=b.vx*d;b.y+=b.vy*d;b.l-=d;for(const e of g.en)if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<(e.big?13:9)){e.hp-=1+S.u.dmg*.5;b.l=0;if(e.hp<=0)g.lt.push({x:e.x,y:e.y,v:e.big?3:1})}}
 g.bl=g.bl.filter(b=>b.l>0);g.en=g.en.filter(e=>e.hp>0);
 for(const l of g.lt){const k=Math.hypot(p.x-l.x,p.y-l.y);if(k<40){l.x+=(p.x-l.x)*6*d;l.y+=(p.y-l.y)*6*d}if(k<10){p.c+=l.v;l.v=0}}
 g.lt=g.lt.filter(l=>l.v>0);
 if(g.t>=25&&!g.z)g.z={x:60+rn()*240,y:100+rn()*440};
 if(g.z){if(Math.hypot(p.x-g.z.x,p.y-g.z.y)<36)g.zt+=d;else g.zt=Math.max(0,g.zt-d);if(g.zt>=2)end(true)}}
function draw(){x.clearRect(0,0,W,H);if(!g)return;const p=g.p;
 if(g.z){x.strokeStyle='#3ddc84';x.lineWidth=3;x.beginPath();x.arc(g.z.x,g.z.y,36,0,7);x.stroke();x.fillStyle='#3ddc8855';x.beginPath();x.moveTo(g.z.x,g.z.y);x.arc(g.z.x,g.z.y,36,-1.57,-1.57+g.zt/2*6.28);x.fill()}
 for(const l of g.lt){x.fillStyle=l.v>1?'#ffd23f':'#7fd8ff';x.fillRect(l.x-4,l.y-4,8,8)}
 for(const e of g.en){x.fillStyle=e.big?'#b5179e':'#e4572e';const s=e.big?13:8;x.fillRect(e.x-s,e.y-s,s*2,s*2)}
 x.fillStyle='#fff';for(const b of g.bl)x.fillRect(b.x-2,b.y-2,4,4);
 x.fillStyle=p.inv>0&&((g.t*10|0)%2)?'#888':'#fff';x.beginPath();x.arc(p.x,p.y,9,0,7);x.fill();
 x.fillStyle='#fff';x.font='14px system-ui';x.fillText('HP '+'♥'.repeat(Math.max(0,p.hp))+'   Loot '+p.c+'   '+(g.t|0)+'s',10,20);
 x.fillText(g.z?'EXTRACT: stand in the green ring (2s)':'Extraction opens at 25s — loot slows you',10,38)}
function loop(t){const d=Math.min(.05,(t-last)/1000||0);last=t;if(run)up(d);draw();requestAnimationFrame(loop)}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
cv.addEventListener('pointerdown',e=>{anc=pos(e);ptr=anc});cv.addEventListener('pointermove',e=>{if(anc)ptr=pos(e)});
addEventListener('pointerup',()=>{anc=ptr=null});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=keys[e.key]=1);addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=keys[e.key]=0});
menu('Loot &amp; Leave','Drag to move. You auto-fire. Grab loot, then reach the green ring to extract. Die and you lose what you carry.');
requestAnimationFrame(loop);
</script></body></html>
